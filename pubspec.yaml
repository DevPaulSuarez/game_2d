name: game_2d
description: "El arquero y la princesa celestial: plataformas 2D en pixel art."
# No se publica en pub.dev.
publish_to: 'none'

# Versión que ve el usuario + número de compilación (1.0.0 es la versión,
# +1 el número de compilación; súbelo al publicar en las tiendas).
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Efectos de sonido y música (lib/sonido/).
  audioplayers: ^6.7.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Reglas de estilo que revisa `flutter analyze` (analysis_options.yaml).
  flutter_lints: ^6.0.0

flutter:
  # Iconos de los botones táctiles (flechas).
  uses-material-design: true

  # Carpetas con archivos que el juego carga. Si añades una carpeta de
  # imágenes o sonidos nueva, ponla aquí.
  assets:
    - lib/personajes/arquero/imagenes/
    - lib/personajes/villano/imagenes/
    - lib/personajes/princesa/imagenes/
    - lib/sonido/efectos/
    - lib/sonido/musica/
